name: gcp

# Jepsen on real GCP VMs. A dispatch on main checks the inputs, builds
# Zigcube in a job that cannot get a GCP token, creates the cluster with
# OpenTofu (tofu/), runs the selected tests from a control VM inside the
# VPC, collects the results as an artifact, and destroys everything in a
# job that always runs. Pull requests get offline checks only: the
# Workload Identity Federation provider admits this repository on
# refs/heads/main alone, so nothing else can reach GCP.
#
# Only `run on GCP` and `tofu destroy` may ask for an OIDC token
# (id-token: write), and they run nothing but this repository's own code
# from main: the Zigcube ref (any branch, tag or commit of Zigbox/zigcube,
# so possibly someone else's code) is built in `build`, which has no
# id-token permission, and reaches the live job as an artifact that is only
# copied, never unpacked or run, on the runner.
# docs/decisions/2026-11-17-gcp-opentofu.md; README "Running on GCP".

on:
  workflow_dispatch:
    inputs:
      zigcube_ref:
        description: Zigbox/zigcube commit, branch or tag to build
        default: fb385b2d0d7e6beefd3225e71ae2bcf3437aa474
      tests:
        description: >-
          Space-separated, run in order: {api,pg}-{fenced,unfenced,negative-control,unfenced-async},
          lease-{valid,wedged,late-kill}, stale-put-{running,registered,idle},
          stale-register-{candidate,control} (zigcube_ref must have the registration barrier)
        default: api-fenced pg-fenced lease-valid lease-wedged
      time_limit:
        description: Seconds of load and faults per register test (lease tests take at least their CI limits)
        default: "120"
  pull_request:
    paths:
      - tofu/**
      - gcp/**
      - .github/workflows/gcp.yml
      - .github/workflows/gcp-sweeper.yml

# Each job asks for what it needs.
permissions: {}

# Live runs go one at a time and are never cancelled mid-way (the teardown
# must run). GitHub keeps at most one *pending* run per group: a dispatch
# made while another run waits replaces (cancels) the waiting one, which
# has created nothing yet. Pull requests are grouped per ref.
concurrency:
  group: gcp-${{ github.event_name == 'workflow_dispatch' && 'live' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOFU_VERSION: "1.13.9"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  offline:
    name: offline checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu -chdir=tofu fmt -check -recursive -diff

      - name: tofu validate
        run: |
          tofu -chdir=tofu init -backend=false -lockfile=readonly
          tofu -chdir=tofu validate

      - name: tofu test (plan against a mocked provider)
        run: tofu -chdir=tofu test

      - name: shellcheck
        run: shellcheck gcp/*.sh gcp/tests/*.sh tofu/scripts/*.sh tofu/tests/*.sh

      - name: dispatch input checks (allow-list, time budget)
        run: gcp/check-inputs.sh --self-test

      - name: sweeper and teardown against stub gcloud and tofu
        run: |
          bash gcp/tests/sweep-test.sh
          bash gcp/tests/tofu-destroy-test.sh

      - name: node startup script's sshd on Ubuntu 24.04 (sshd -T)
        # A throwaway container: the test rewrites /etc/ssh and /root.
        run: docker run --rm -v "$PWD:/w:ro" ubuntu:24.04 bash /w/tofu/tests/startup-sshd.sh

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          # Built from the tagged module (Go is on the runner), so there is no
          # binary checksum to keep up to date.
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          "$RUNNER_TEMP/bin/actionlint" -color

  inputs:
    name: check the inputs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Inputs and repository variables
        env:
          ZIGCUBE_REF: ${{ inputs.zigcube_ref }}
          TESTS: ${{ inputs.tests }}
          TIME_LIMIT: ${{ inputs.time_limit }}
          # The live job's timeout-minutes, below; keep the two equal.
          LIVE_TIMEOUT_MIN: "150"
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          gcp/check-inputs.sh
          for v in GCP_PROJECT_ID GCP_REGION GCP_ZONE TF_STATE_BUCKET GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is not set"; exit 1; }
          done

  build:
    name: build Zigcube (no GCP access)
    needs: inputs
    runs-on: ubuntu-24.04
    # Up to three Zigcube builds: the ref, and for stale-register the two
    # barrier servers (docs/stale-register.md).
    timeout-minutes: 60
    # No id-token: this job runs the Zigcube ref's build.zig, which may be
    # anyone's code.
    permissions:
      contents: read
    env:
      # stale-register's control: Zigcube 0.5.2, built with the barrier
      # patched in (gcp/patches/register-barrier-190f8dc.patch). Its agent
      # is the one both runs use.
      STALE_REGISTER_CONTROL_REF: 190f8dcfa60a22da62d82ad8bac714cb64848c59
      ZIG_VERSION: "0.17.0"
      # From https://ziglang.org/download/index.json, 0.17.0 / x86_64-linux / shasum.
      ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    steps:
      - name: Check out Zigcube
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Zigbox/zigcube
          ref: ${{ inputs.zigcube_ref }}
          path: zigcube
          persist-credentials: false

      # Only for the patch under gcp/patches; nothing here runs from it.
      - name: Check out this repository
        if: contains(inputs.tests, 'stale-register-')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: harness
          persist-credentials: false

      - name: Check out Zigcube for the stale-register control
        if: contains(inputs.tests, 'stale-register-')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Zigbox/zigcube
          ref: ${{ env.STALE_REGISTER_CONTROL_REF }}
          path: zigcube-control
          persist-credentials: false

      - name: Build Zigcube and pack the bundle
        env:
          STALE_REGISTER: ${{ contains(inputs.tests, 'stale-register-') }}
        run: |
          archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" "https://ziglang.org/download/${ZIG_VERSION}/${archive}"
          echo "${ZIG_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          zig="${RUNNER_TEMP}/zig-x86_64-linux-${ZIG_VERSION}/zig"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev libsqlite3-dev
          cd zigcube
          "$zig" build -Doptimize=ReleaseSafe -Dcpu=baseline
          b="${RUNNER_TEMP}/bundle"
          mkdir -p "$b/bin" "${RUNNER_TEMP}/out"
          cp zig-out/bin/zcube-server zig-out/bin/zcube-agent "$b/bin/"
          cp fixtures/images.zon "$b/images.zon"
          cp src/constants.zig "$b/constants.zig"
          git rev-parse HEAD > "$b/COMMIT"
          # Zigcube's release bundle, where this ref has one (zigcube#277);
          # shipped alongside, the harness still uses bin/.
          if "$zig" build -l | grep -qE '^\s+dist\b'; then
            "$zig" build dist -Doptimize=ReleaseSafe -Dcpu=baseline
            mkdir -p "$b/dist" && cp -r zig-out/. "$b/dist/"
          fi
          # stale-register: zcube-server built with -Dregister-barrier=true,
          # at the ref (candidate) and at 0.5.2 with the barrier patched in
          # (control), both with 0.5.2's agent. Built here from source, each
          # into its own prefix; never part of dist/ or bin/.
          # docs/stale-register.md.
          if [ "$STALE_REGISTER" = true ]; then
            barrier=(-Doptimize=ReleaseSafe -Dcpu=baseline -Dregister-barrier=true)
            sr="$b/stale-register"
            # A ref without #281 (7d141a7) has no barrier option; say so
            # here rather than as zig's "invalid option".
            "$zig" build -h | grep -q -- '-Dregister-barrier' \
              || { echo "::error::zigcube_ref $(git rev-parse HEAD) has no -Dregister-barrier (it needs Zigbox/zigcube#281)"; exit 1; }
            "$zig" build "${barrier[@]}" -p "${RUNNER_TEMP}/sr-candidate"
            (
              cd ../zigcube-control
              git apply --index ../harness/gcp/patches/register-barrier-190f8dc.patch
              "$zig" build "${barrier[@]}" -p "${RUNNER_TEMP}/sr-control"
            )
            for v in candidate control; do
              mkdir -p "$sr/$v/bin"
              cp "${RUNNER_TEMP}/sr-$v/bin/zcube-server" "$sr/$v/bin/"
              cp "${RUNNER_TEMP}/sr-control/bin/zcube-agent" "$sr/$v/bin/"
            done
            cp fixtures/images.zon "$sr/candidate/images.zon"
            cp ../zigcube-control/fixtures/images.zon "$sr/control/images.zon"
            git rev-parse HEAD > "$sr/candidate/COMMIT"
            echo "$STALE_REGISTER_CONTROL_REF + gcp/patches/register-barrier-190f8dc.patch" > "$sr/control/COMMIT"
            # The barrier reads this variable only when it is built in.
            for f in "$sr"/*/bin/zcube-server; do
              grep -q ZCUBE_TEST_REGISTER_BARRIER "$f" || { echo "::error::$f has no barrier"; exit 1; }
            done
            # And nothing shipped may have it: bin/, every file in dist/
            # (loose binaries too), and every archive there, unpacked. An
            # archive that does not unpack, or a dist/ with no archive,
            # fails the step rather than passing it unchecked.
            shipped="${RUNNER_TEMP}/shipped"
            mkdir -p "$shipped" && cp "$b/bin/zcube-server" "$shipped/"
            if [ -d "$b/dist" ]; then
              n=0
              while IFS= read -r -d '' a; do
                d="$shipped/archive-$n"; mkdir -p "$d"
                case "$a" in
                  *.tar.gz|*.tgz) tar -xzf "$a" -C "$d" ;;
                  *.tar.xz) tar -xJf "$a" -C "$d" ;;
                  *.tar.zst) tar --zstd -xf "$a" -C "$d" ;;
                  *.zip) unzip -q "$a" -d "$d" ;;
                esac || { echo "::error::cannot unpack $a"; exit 1; }
                n=$((n + 1))
              done < <(find "$b/dist" -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' \
                         -o -name '*.tar.zst' -o -name '*.zip' \) -print0)
              [ "$n" -gt 0 ] || { echo "::error::dist/ has no archive to check"; exit 1; }
              echo "stale-register: checked bin/, dist/ and $n archive(s) for the barrier"
            fi
            scan=("$shipped" "$b/bin")
            [ -d "$b/dist" ] && scan+=("$b/dist")
            if grep -rlq ZCUBE_TEST_REGISTER_BARRIER "${scan[@]}"; then
              echo "::error::a shipped build has the barrier: $(grep -rl ZCUBE_TEST_REGISTER_BARRIER "${scan[@]}")"; exit 1
            fi
            echo "stale-register: candidate $(cat "$sr/candidate/COMMIT"), control $(cat "$sr/control/COMMIT")" >> "$GITHUB_STEP_SUMMARY"
          fi
          tar -czf "${RUNNER_TEMP}/out/zigcube.tar.gz" -C "$b" .
          find "$b" -type f -printf '%s\t%p\n' | head -40
          echo "zigcube $(cat "$b/COMMIT")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zigcube-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/out/zigcube.tar.gz
          retention-days: 3
          if-no-files-found: error

  live:
    name: run on GCP
    needs: [inputs, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # check-inputs.sh's budget assumes 150; keep LIVE_TIMEOUT_MIN equal.
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    env:
      # Checked by the inputs job; only ever used quoted, from the environment.
      TESTS: ${{ inputs.tests }}
      TIME_LIMIT: ${{ inputs.time_limit }}
      RUN_ID: ${{ github.run_id }}
      ZONE: ${{ vars.GCP_ZONE }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      RESULTS: ${{ github.workspace }}/results
    steps:
      - run: echo "CREATED_UNIX=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Data only: copied to the control VM as it is, never unpacked here.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zigcube-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/in

      - name: Pack the harness
        # git archive: only tracked files, so the auth action's credential
        # config in the workspace is never shipped.
        run: git archive --format=tar.gz -o "${RUNNER_TEMP}/harness.tar.gz" HEAD

      - name: Throwaway SSH key for root on the nodes
        run: ssh-keygen -q -t ed25519 -N '' -C "zj-${RUN_ID}" -f "${RUNNER_TEMP}/zj-key"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu apply
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          export TF_VAR_run_id="$RUN_ID" TF_VAR_created_unix="$CREATED_UNIX"
          TF_VAR_root_ssh_public_key="$(cat "${RUNNER_TEMP}/zj-key.pub")"
          export TF_VAR_root_ssh_public_key
          tofu -chdir=tofu init -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=runs/${RUN_ID}"
          tofu -chdir=tofu apply -auto-approve
          echo "CONTROL=$(tofu -chdir=tofu output -raw control_name)" >> "$GITHUB_ENV"
          {
            echo "state: gs://${TF_STATE_BUCKET}/runs/${RUN_ID}"
            echo "image: $(tofu -chdir=tofu output -raw image)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the control VM (SSH over IAP)
        run: gcp/ci.sh wait-ssh

      - name: Ship the harness, the Zigcube bundle and the key
        run: gcp/ci.sh ship "${RUNNER_TEMP}/harness.tar.gz" "${RUNNER_TEMP}/in/zigcube.tar.gz" "${RUNNER_TEMP}/zj-key"

      - name: Run the tests on the control VM
        run: |
          gcp/ci.sh start "$TESTS" "$TIME_LIMIT"
          gcp/ci.sh wait

      - name: Collect the results
        if: always() && env.CONTROL != ''
        run: |
          gcp/ci.sh fetch && rc=0 || rc=$?
          if [ -f "$RESULTS/out/summary.tsv" ]; then
            {
              echo '| test | exit | outcome | seconds | store |'
              echo '|---|---|---|---|---|'
              tail -n +2 "$RESULTS/out/summary.tsv" | awk -F'\t' '{print "| "$1" | "$2" | "$3" | "$4" | "$5" |"}'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in "$RESULTS"/out/logs/*.log; do
            case "$f" in */lein-deps.log) continue ;; esac
            echo "::group::$(basename "$f")"
            grep -E 'jepsen.util :nemesis' "$f" | cut -c1-220 || true
            grep -E 'write outage per failover|zcube-jepsen.core lease:' "$f" | cut -c1-400 || true
            tail -n 25 "$f"
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Diagnostics (serial output, startup journals)
        # Whenever the run failed, the cluster got that far or not: a VM
        # that never became ready says why only here.
        if: failure()
        run: gcp/ci.sh diag

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jepsen-gcp-${{ github.run_id }}
          path: results/
          retention-days: 14
          if-no-files-found: warn

  teardown:
    name: tofu destroy
    needs: live
    # Whatever happened to the run, cancelled included; not when the live
    # job never started (bad inputs, failed build: nothing was created).
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && needs.live.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RUN_ID: ${{ github.run_id }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu destroy
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          # Destroy needs a value; it is not used.
          TF_VAR_root_ssh_public_key: ssh-ed25519 destroy
        run: |
          export TF_VAR_run_id="$RUN_ID"
          tofu -chdir=tofu init -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=runs/${RUN_ID}"
          # A run cancelled during apply leaves its state lock behind (the
          # runner kills tofu seconds after the cancel). By now the live job
          # is over and the concurrency group admits no other run, so a lock
          # on this run's own state is stale: remove it and go on.
          gcp/tofu-destroy.sh

      - name: Delete what is left of this run (not in the state, or not destroyed)
        # After a cancelled apply, GCE may have created resources tofu never
        # wrote to the state. Found and deleted is not a failure here.
        if: always()
        env:
          FOUND_EXIT: "0"
        run: gcp/sweep.sh

      - name: Nothing of this run is left
        if: always()
        env:
          DRY_RUN: "1"
        run: gcp/sweep.sh
